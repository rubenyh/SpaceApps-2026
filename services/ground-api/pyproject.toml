[project]
name = "ground-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rubenyh", email = "rubenyanezhernandez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.0",
]

[project.scripts]
