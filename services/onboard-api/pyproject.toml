[project]
name = "onboard-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rubenyh", email = "rubenyanezhernandez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.163.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
onboard-api = "onboard_api:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "onboard_api.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
