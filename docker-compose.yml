# Onboard demo stack. From the repo root: docker compose up --build
# The Tauri console runs on the host and talks to http://127.0.0.1:8000.

x-onboard-env: &onboard-env
  ONBOARD_DB_PATH: /data/sqlite/onboard.db
  WELLBEING_DB_PATH: /data/sqlite/wellbeing.db
  # Ground services are not part of this stack; set to true with ONBOARD_GROUND_API_URL to publish.
  ONBOARD_TELEMETRY_ENABLED: ${ONBOARD_TELEMETRY_ENABLED:-false}
  ONBOARD_GROUND_API_URL: ${ONBOARD_GROUND_API_URL:-http://host.docker.internal:8001}
  ONBOARD_CHROMA_PATH: /data/chroma
  ONBOARD_OLLAMA_BASE_URL: http://ollama:11434
  ONBOARD_OLLAMA_CHAT_MODEL: ${ONBOARD_OLLAMA_CHAT_MODEL:-qwen2.5:0.5b}
  ONBOARD_OLLAMA_EMBED_MODEL: ${ONBOARD_OLLAMA_EMBED_MODEL:-bge-m3}

services:
  onboard-api:
    build:
      context: .
      dockerfile: services/onboard-api/Dockerfile
    image: space-apps/onboard-api
    environment: *onboard-env
    ports:
      - "127.0.0.1:${ONBOARD_API_PORT:-8000}:8000"
    volumes:
      - sqlite:/data/sqlite
      - chroma:/data/chroma
    restart: unless-stopped
    # No depends_on ollama: alarm and SOS replies must work while models are down.

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  demo-init:
    image: space-apps/onboard-api  # built by onboard-api
    pull_policy: never
    healthcheck:
      disable: true  # the image healthcheck probes the API, not this job
    command: ["python", "scripts/prepare_demo.py"]
    environment: *onboard-env
    volumes:
      - chroma:/data/chroma
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  simulator:
    image: python:3.12-slim-bookworm
    command: ["python", "-u", "/firmware/simulator.py", "--url", "http://onboard-api:8000"]
    volumes:
      - ./firmware:/firmware:ro
    init: true  # forwards SIGTERM so `docker compose down` stops it at once
    depends_on:
      onboard-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite:
  chroma:
  ollama:
