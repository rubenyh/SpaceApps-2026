# Demo stack (onboard + ground). From the repo root: docker compose up --build
# Or run.ps1 (Windows) / run.sh (macOS) to also open both Tauri consoles. The consoles run on the host and talk to
# http://127.0.0.1:8000 (spaceship-app) and http://127.0.0.1:8001 (base-app).

x-onboard-env: &onboard-env
  ONBOARD_DB_PATH: /data/sqlite/onboard.db
  WELLBEING_DB_PATH: /data/sqlite/wellbeing.db
  WELLBEING_MISSION_TZ: ${WELLBEING_MISSION_TZ:-America/Tijuana}
  # Telemetry goes to the ground-api service below. Set false to keep the ship offline.
  ONBOARD_TELEMETRY_ENABLED: ${ONBOARD_TELEMETRY_ENABLED:-true}
  ONBOARD_GROUND_API_URL: ${ONBOARD_GROUND_API_URL:-http://ground-api:8001}
  ONBOARD_CHROMA_PATH: /data/chroma
  ONBOARD_OLLAMA_BASE_URL: http://ollama:11434
  ONBOARD_OLLAMA_CHAT_MODEL: ${ONBOARD_OLLAMA_CHAT_MODEL:-qwen2.5:3b}
  ONBOARD_OLLAMA_EMBED_MODEL: ${ONBOARD_OLLAMA_EMBED_MODEL:-bge-m3}
  # Outage demo controls (docs/demo-outage.md): link pause/resume, scenario reset.
  ONBOARD_DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-false}

services:
  onboard-api:
    build:
      context: .
      dockerfile: services/onboard-api/Dockerfile
    image: space-apps/onboard-api
    environment: *onboard-env
    ports:
      # ONBOARD_API_HOST=0.0.0.0 publishes it on the LAN for a real watch (run.sh --watch-device).
      - "${ONBOARD_API_HOST:-127.0.0.1}:${ONBOARD_API_PORT:-8000}:8000"
    volumes:
      - sqlite:/data/sqlite
      - chroma:/data/chroma
    restart: unless-stopped
    # No depends_on ollama: alarm and SOS replies must work while models are down.

  ground-api:
    build: services/ground-api
    image: space-apps/ground-api
    environment:
      GROUND_DB_PATH: /data/ground.db
      GROUND_DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-false}
    ports:
      - "127.0.0.1:${GROUND_API_PORT:-8001}:8001"
    volumes:
      - ground:/data
    restart: unless-stopped
    # No depends_on from onboard-api: the publisher retries and sends the backlog later.

  ollama:
    image: ollama/ollama:0.40.16
    environment:
      # Keep the chat model loaded: a cold load of qwen2.5:3b takes minutes on CPU,
      # far over the interpreter timeout, so an unloaded model is never used.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  demo-init:
    image: space-apps/onboard-api  # built by onboard-api
    pull_policy: never
    healthcheck:
      disable: true  # the image healthcheck probes the API, not this job
    command: ["python", "scripts/prepare_demo.py"]
    environment: *onboard-env
    volumes:
      - chroma:/data/chroma
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  simulator:
    image: python:3.12-slim-bookworm
    # SIMULATOR_ARGS="--real-urine ast-01": the ESP32 sends ast-01's urine pH/salinity/temp (run.sh --urine-device, run.ps1 -UrineDevice).
    command: ["sh", "-c", "exec python -u /firmware/simulator.py --url http://onboard-api:8000 ${SIMULATOR_ARGS:-}"]
    volumes:
      - ./firmware:/firmware:ro
    init: true  # forwards SIGTERM so `docker compose down` stops it at once
    depends_on:
      onboard-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite:
  chroma:
  ollama:
  ground:
